telegram.help.cmd.resend.usage=/resend [entity=order|license] [selectors from /s] [online|offline] [-e|-ne|-t]  (or reply to order/control message)
telegram.help.cmd.resend.desc=Interactive action. Opens candidate view and executes RESEND after Confirm current/all. Supports order-style key/output params (online/offline, -e/-ne/-t). Subscription flags are not supported.
telegram.help.cmd.detach.usage=/detach [selectors from /s]  (or reply to order/control message)
telegram.help.cmd.detach.desc=Interactive action. Opens candidate view and executes DETACH after Confirm current/all. Availability depends on enabled providers in this build.
telegram.help.cmd.block.usage=/block [selectors from /s]  (or reply to order/control message)
telegram.help.cmd.block.desc=Interactive action. Opens candidate view and sets status BLOCKED after Confirm current/all.
telegram.help.cmd.allow.usage=/allow [selectors from /s]  (or reply to order/control message)
telegram.help.cmd.allow.desc=Interactive action. Opens candidate view and sets status ALLOWED after Confirm current/all.
