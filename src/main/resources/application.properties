spring.application.name=ZillWrapper
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# API masking/auth
api.auth.source-identifier=${API_AUTH_SOURCE_IDENTIFIER:api}
api.masking.allow-human=${API_MASKING_ALLOW_HUMAN:false}
api.masking.session.inactivity-seconds=${API_MASKING_SESSION_INACTIVITY_SECONDS:1800}
api.masking.cleanup.fixed-delay-ms=${API_MASKING_CLEANUP_FIXED_DELAY_MS:60000}

# WhiteAdmin base
whiteAdminPanel.target=${WHITE_ADMIN_BASE_URL}
whiteAdminPanel.username=${WHITE_LOGIN}
whiteAdminPanel.password=${WHITE_PASSWORD}
whiteAdminPanel.auth.loginPage=admin_page.php

# WhiteAdmin orders
whiteAdminPanel.orders.listPage=admin_page.php
whiteAdminPanel.orders.detailsPage=admin_page_popup.php
whiteadmin.orders.createUrl=${WHITEADMIN_ORDER_CREATE_URL:}
whiteAdminPanel.orders.payedSuffix=cat=filter&status[]=PAYED

# WhiteAdmin ZAB licenses
whiteAdminPanel.zab.latestPage=admin_corp.php
whiteAdminPanel.zab.detailsPage=admin_corp_edit_code.php
whiteAdminPanel.zab.activationsPage=admin_corp_activations.php
whiteAdminPanel.zab.generatePackPage=admin_corp.php

# WhiteAdmin ZIS 2.0 licenses
whiteAdminPanel.zis2.latestPage=admin_lic.php
whiteAdminPanel.zis2.detailsPage=admin_lic_edit_code.php
whiteAdminPanel.zis2.activationsPage=admin_lic_activations.php
whiteAdminPanel.zis2.generatePackPage=admin_lic.php
whiteAdminPanel.ssl.insecure=false
whiteAdminPanel.catchupEnabled=true
whiteAdminPanel.catchupBootstrapWindow=200

telegram.bot.zill.bot-token=${ZILL_TOKEN}
telegram.bot.zill.bot-name=${ZILL_BNAME}
telegram.question.delete-on-answer=false
telegram.control.handling-info.debounce-ms=200
telegram.render.html.cards.enabled=true

# Compatibility aliases (to be removed later)
whiteAdminPanel.orders=${whiteAdminPanel.orders.listPage}
whiteAdminPanel.zab_orders=${whiteAdminPanel.orders.listPage}
whiteAdminPanel.payed_suffix=${whiteAdminPanel.orders.payedSuffix}
whiteAdminPanel.lic_2_0_page=${whiteAdminPanel.zis2.latestPage}
whiteAdminPanel.lic_2_0_inf=${whiteAdminPanel.zis2.generatePackPage}
whiteAdminPanel.zabEndPoint=${whiteAdminPanel.zab.generatePackPage}
whiteAdminPanel.zab_lic_inf=${whiteAdminPanel.zab.generatePackPage}

users.sync.enabled=true
users.sync.config-path=${USERS_SYNC_CONFIG_PATH:./users.json}
order.reference.white-admin-window=7000
order.reference.portal-window=700
order.reference.white-admin-baseline=96412
order.reference.portal-baseline=2993

pending.cleanup.enabled=true
pending.cleanup.retention-days=7
pending.cleanup.fixed-delay-ms=3600000
pending.task.ttl.order-preview-minutes=15
interaction.search.min-key-selector-length=4
interaction.license-mutation.special-confirm-threshold=50
enrichment.parallelism=1
enrichment.parallelism.license=${enrichment.parallelism}
enrichment.parallelism.activations=${enrichment.parallelism}
enrichment.activations.max-attempts=3
enrichment.activations.retry-backoff-ms=250
enrichment.activations.drain-timeout-ms=30000
subscription.prenotify.extra-days=1
subscription.missing-expiration.backoff-minutes=720
subscription.scheduler.fixed-delay-ms=60000
subscription.delivery.fixed-delay-ms=60000
subscription.delivery.max-attempts=3
subscription.delivery.backoff.attempt1-minutes=1
subscription.delivery.backoff.attempt2-minutes=5
subscription.delivery.backoff.default-minutes=30


spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.flyway.baseline-on-migrate=true

spring.flyway.baseline-version=1

flyway.url=${DB_URL}
flyway.user=${DB_USER}
flyway.password=${DB_PASS}
flyway.locations=classpath:db/migration
flyway.baselineOnMigrate=true
flyway.baselineVersion=1


spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT}
spring.mail.protocol=${SPRING_MAIL_PROTOCOL}
spring.mail.default-encoding=UTF-8
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.debug=false
logging.level.com.zillya.timonfech.zillwrapper=INFO
logging.level.com.zillya.timonfech.zillwrapper.core.subscription=INFO

email.routing.rules[0].id=notify-email
email.routing.rules[0].operation-type=LICENSE_FULFILLMENT
email.routing.rules[0].contact-type=EMAIL
email.routing.rules[0].enabled=true
email.routing.rules[0].template=license_email
email.routing.rules[0].subject-keys.single=email.license.subject.single
email.routing.rules[0].subject-keys.plural=email.license.subject.plural
email.routing.rules[0].subject-keys.offline-suffix=email.license.subject.suffix.offline

email.routing.rules[1].id=resend-email
email.routing.rules[1].operation-type=RESEND_NOTIFICATION
email.routing.rules[1].contact-type=EMAIL
email.routing.rules[1].enabled=true
email.routing.rules[1].template=license_email
